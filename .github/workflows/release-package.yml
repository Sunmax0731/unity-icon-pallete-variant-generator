name: Release Package

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Release package version"
        required: false
        default: "ci"

jobs:
  build-release-package:
    name: Build release ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "ci"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release ZIP from tracked files
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\release\build-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Validate release ZIP contents
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\release\test-release-package.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaletteVariantGenerator_${{ steps.version.outputs.value }}
          path: ReleaseBuilds/PaletteVariantGenerator_v${{ steps.version.outputs.value }}.zip
